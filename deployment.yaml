apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-event-app
  template:
    metadata:
      labels:
        app: college-event-app
    spec:
      containers:
        - name: college-event-app
          image: devops-project
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: registration-storage
              mountPath: /app/backend/data
      volumes:
        - name: registration-storage
          persistentVolumeClaim:
            claimName: registrations-pvc